#cloud-config

package_update: true
package_upgrade: true

#Install basic dependencies.
packages:
  - wget
  - curl
  - jq
  - ca-certificates
  - apt-transport-https
  - software-properties-common
  - net-tools
  - gnupg
  - lsb-release
  - zip
  - unzip
  - python3 
  - python3-pip 
  - python3-psycopg2 
  - python3-yaml 
  - python3-click

#Run shell commands.
runcmd:
  - apt update

  #Create a swapfile.
  - |
    if [ ! -f /swapfile ]; then
      fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      echo '/swapfile none swap sw 0 0' >> /etc/fstab
    fi

  #Set swappiness.
  - |
    sysctl vm.swappiness=10
    echo 'vm.swappiness=10' >> /etc/sysctl.conf

  #Update the hosts file file private IP addresses and hostnames for the cluster nodes.
  - |
    echo "10.0.0.2 ${node_prefix}-primary.${domain}" >> /etc/hosts
    echo "10.0.0.3 ${node_prefix}-replica.${domain}" >> /etc/hosts
    echo "10.0.0.4 ${node_prefix}-reporting.${domain}" >> /etc/hosts
  
  #Install DigitalOcean monitoring agent
  - curl -sSL https://repos.insights.digitalocean.com/install.sh | bash

  #Add the PostgreSQL 18 repository.
  - curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
  - echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt jammy-pgdg main" > /etc/apt/sources.list.d/pgdg.list
  - apt update

  #Install Postgres, freeze the package version and clean the data directory.
  - apt install -y postgresql-18 postgresql-client-18
  - apt-mark hold postgresql-18 postgresql-client-18
  - apt-mark showhold

#Reboot the server to apply all changes.
power_state:
  mode: reboot
  message: "Rebooting after installing dependencies."
  timeout: 30

final_message: "Cloud-init script completed successfully and the server rebooted to apply changes."

