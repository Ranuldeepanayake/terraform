#cloud-config

package_update: true
package_upgrade: true

#Install basic dependencies.
packages:
  - wget
  - curl
  - jq
  - ca-certificates
  - software-properties-common
  - net-tools
  - gnupg
  - lsb-release 

#Create a default user.
users:
  - name: droplet
    gecos: "Default user"
    groups: sudo                  #Add to the sudoers group.
    create_home: true             #Create a home directory for the user.
    home: /home/droplet           #Set the home directory.
    shell: /bin/bash              #Set the default shell.
    lock-passwd: false            #Allow password SSH login.
    sudo: ALL=(ALL) NOPASSWD:ALL  #Allows sudo without password.
    ssh_authorized_keys:
      - ssh-rsa  ranul@RANGER-PC
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINemEPAI1ni+i944cNyXwdWYNukBpbEOO/nJmomBTMoZ ranul@kubernetes-master-1
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP04bTVc0JEBIkfaq+qYr95i1cHtQIqfsF2fgZHndUpo ranul@TG-LAP-17

#Set a password for the default user.
chpasswd:
  list: |
    droplet:ranul@123!  
  expire: false                

#SSH options.
ssh:
  allow_root: false        #Disables root SSH login.
  permit_root_login: no    #Disables root SSH login (older versions of cloud-init use this key instead of allow_root).

#SSH options.
write_files:
  - path: /etc/ssh/sshd_config.d/disable-root-login.conf
    permissions: '0644'
    owner: root:root
    content: |
      PermitRootLogin no

#Run shell commands.
runcmd:
  - apt update

  #Create a swapfile.
  - |
    if [ ! -f /swapfile ]; then
      fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      echo '/swapfile none swap sw 0 0' >> /etc/fstab
    fi

  #Set swappiness.
  - |
    sysctl vm.swappiness=10
    echo 'vm.swappiness=10' >> /etc/sysctl.conf

  #Install haproxy and freeze the package version.
  - apt install -y haproxy=2.4.30-0ubuntu0.22.04.1
  - apt-mark hold haproxy

  - |
    cat <<EOF > /etc/haproxy/haproxy.cfg
    global
        log /dev/log local0
        maxconn 512

    defaults
        log global
        mode tcp
        timeout connect 10s
        timeout client  1m
        timeout server  1m

    #################################
    # WRITE TRAFFIC (Leader only)
    #################################
    frontend postgres_write
        bind *:5432
        default_backend postgres_leader

    backend postgres_leader
        option httpchk GET /primary
        http-check expect status 200
        server pg1 ${pg1}:5432 check port 8008 check-ssl verify none
        server pg2 ${pg2}:5432 check port 8008 check-ssl verify none

    #################################
    # READ TRAFFIC (Replicas only)
    #################################
    frontend postgres_read
        bind *:5433
        default_backend postgres_replicas

    backend postgres_replicas
        option httpchk GET /replica
        http-check expect status 200
        balance roundrobin
        server pg1 ${pg1}:5432 check port 8008 check-ssl verify none
        server pg2 ${pg2}:5432 check port 8008 check-ssl verify none

    #################################
    # Stats UI
    #################################
    listen stats
        bind *:7000
        mode http
        stats enable
        stats uri /
    EOF

  #Enable and start haproxy.
  - systemctl enable haproxy && sudo systemctl restart haproxy && sudo systemctl status haproxy

#Reboot the server to apply all changes.
power_state:
  mode: reboot
  message: "Rebooting after installing dependencies."
  timeout: 30

final_message: "Cloud-init script has completed successfully and the server rebooted to apply changes."