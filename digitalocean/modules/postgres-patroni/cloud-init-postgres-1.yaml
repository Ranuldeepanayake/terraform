#cloud-config

package_update: true
package_upgrade: true

#Install basic dependencies.
packages:
  - wget
  - curl
  - jq
  - ca-certificates
  - software-properties-common
  - net-tools
  - gnupg
  - lsb-release 
  - python3 
  - python3-pip 
  - python3-psycopg2 
  - python3-yaml 
  - python3-click

#Create a default user.
users:
  - name: droplet
    gecos: "Default user"
    groups: sudo                  #Add to the sudoers group.
    create_home: true             #Create a home directory for the user.
    home: /home/droplet           #Set the home directory.
    shell: /bin/bash              #Set the default shell.
    lock-passwd: false            #Allow password SSH login.
    sudo: ALL=(ALL) NOPASSWD:ALL  #Allows sudo without password.
    ssh_authorized_keys:
      - ssh-rsa  ranul@RANGER-PC
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINemEPAI1ni+i944cNyXwdWYNukBpbEOO/nJmomBTMoZ ranul@kubernetes-master-1

#Set a password for the default user.
chpasswd:
  list: |
    droplet:ranul@123!
  expire: false                

#SSH options.
ssh:
  allow_root: false        #Disables root SSH login.
  permit_root_login: no    #Disables root SSH login (older versions of cloud-init use this key instead of allow_root).

#SSH options.
write_files:
  - path: /etc/ssh/sshd_config.d/disable-root-login.conf
    permissions: '0644'
    owner: root:root
    content: |
      PermitRootLogin no

#Run shell commands.
runcmd:
  - apt update  

  #Create a swapfile.
  - |
    if [ ! -f /swapfile ]; then
      fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      echo '/swapfile none swap sw 0 0' >> /etc/fstab
    fi

  #Set swappiness.
  - |
    sysctl vm.swappiness=10
    echo 'vm.swappiness=10' >> /etc/sysctl.conf

  #Update the hosts file file private IP addresses and hostnames for the cluster nodes.
  - |
    echo "10.0.1.2 ${node_prefix}-1.${domain}" >> /etc/hosts
    echo "10.0.1.3 ${node_prefix}-2.${domain}" >> /etc/hosts
    echo "10.0.1.4 ${node_prefix}-3.${domain}" >> /etc/hosts

  #Install the DigitalOcean monitoring agent.
  - curl -sSL https://repos.insights.digitalocean.com/install.sh | bash

  #Add the PostgreSQL 18 repository.
  - curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
  - echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt jammy-pgdg main" > /etc/apt/sources.list.d/pgdg.list
  - apt update

  #Create directories and set permissions.
  - mkdir -p /etc/patroni
  - mkdir -p /var/lib/postgresql/18/main
  - chmod 700 /var/lib/postgresql/18/main
  - chown postgres:postgres /var/lib/postgresql/18/main

  #Create the etcd config file.
  - |
    cat <<EOF > /etc/default/etcd
    ETCD_NAME="${node_prefix}-1"
    ETCD_ENABLE_V2="false"
    ETCD_ENABLE_V3="true"
    ETCD_DATA_DIR="/var/lib/etcd/default"
    ETCD_INITIAL_CLUSTER="${node_prefix}-1=http://${node_prefix}-1.${domain}:2380,${node_prefix}-2=http://${node_prefix}-2.${domain}:2380,${node_prefix}-3=http://${node_prefix}-3.${domain}:2380"
    ETCD_INITIAL_CLUSTER_STATE="new"
    ETCD_INITIAL_CLUSTER_TOKEN="etcd-cluster-q9P22pVRIj7ExbpX"
    ETCD_INITIAL_ADVERTISE_PEER_URLS="http://${node_prefix}-1.${domain}:2380"
    ETCD_ADVERTISE_CLIENT_URLS="http://${node_prefix}-1.${domain}:2379"
    ETCD_LISTEN_PEER_URLS="http://0.0.0.0:2380"
    ETCD_LISTEN_CLIENT_URLS="http://0.0.0.0:2379"
    EOF

  #Create the patroni config directory.
  - mkdir -p /etc/patroni

  #Create the patroni config file.
  - |
    cat <<EOF > /etc/patroni/patroni.yml
    scope: ${cluster_name}
    namespace: /service/
    name: ${node_prefix}-1

    restapi:
      listen: 0.0.0.0:8008
      connect_address: ${node_prefix}-1.${domain}:8008
      certfile: /etc/patroni/certs/${node_prefix}-1.crt
      keyfile: /etc/patroni/certs/${node_prefix}-1.key
      cafile: /etc/patroni/certs/ca.crt

    etcd3:
      hosts: 
        - ${node_prefix}-1.${domain}:2379
        - ${node_prefix}-2.${domain}:2379
        - ${node_prefix}-3.${domain}:2379
      protocol: http
      timeout: 30
      api_version: v3

    bootstrap:
      dcs:
        ttl: 30
        loop_wait: 10
        retry_timeout: 10
        maximum_lag_on_failover: 1048576
        synchronous_mode: true
        synchronous_mode_strict: false
        postgresql:
          use_pg_rewind: true
          parameters:
            wal_level: replica
            hot_standby: "on"
            max_wal_senders: 10
            max_replication_slots: 10
            wal_keep_size: 512MB
            max_wal_size: 2GB
            min_wal_size: 512MB
            max_slot_wal_keep_size: 4GB
            wal_log_hints: "on"
            wal_compression: "on"
            archive_mode: "on"
            archive_command: "pgbackrest --stanza=${cluster_name} archive-push %p"
            archive_timeout: 60
      initdb:
        - encoding: UTF8
        - data-checksums
      users:
        replication:
          password: e5tLUXDW5Gc2s3Ra
          options:
            - replication

    postgresql:
      listen: 0.0.0.0:5432
      connect_address: ${node_prefix}-1.${domain}:5432
      data_dir: /var/lib/postgresql/18/main
      bin_dir: /usr/lib/postgresql/18/bin
      use_slots: true
      pg_hba:
          #The postgres user can connect to any database over the UNIX socket if logged in as the postgres Linux user.
        - local all postgres peer
          #Any user can connect to any database over TCP IP from the allowed source IP range with a password.
        - host all all 127.0.0.1/32 md5
          #The replication user can connect to the replication database over TCP IP from the allowed source IP range with a password.
        - host replication replication 127.0.0.1/32 md5
        - hostssl replication replication 10.0.1.0/24 md5
          #Any user can connect to any database over TCP IP from the allowed source IP range with a password.
        - hostssl all all 10.0.1.0/24 md5
      authentication:
        replication:
          username: replication
          password: e5tLUXDW5Gc2s3Ra
        superuser:
          username: postgres
          password: y2pVq6HmPoOdux85
        rewind:
          username: replication
          password: e5tLUXDW5Gc2s3Ra
      parameters:
        shared_buffers: 128MB
        effective_cache_size: 350MB
        work_mem: 2MB
        maintenance_work_mem: 64MB
        autovacuum_work_mem: 32MB
        temp_buffers: 8MB
        checkpoint_timeout: 5min
        checkpoint_completion_target: 0.5
        max_connections: 200
        max_worker_processes: 4
        max_parallel_workers: 2
        max_parallel_workers_per_gather: 1
        ssl: "on"
        ssl_cert_file: "/etc/patroni/certs/${node_prefix}-1.crt"
        ssl_key_file: "/etc/patroni/certs/${node_prefix}-1.key"
        ssl_ca_file: "/etc/patroni/certs/ca.crt"
    EOF

  #Create the patroni service.
  - |
    cat <<EOF > /etc/systemd/system/patroni.service
    [Unit]
    Description=Patroni PostgreSQL HA Cluster
    After=network-online.target etcd.service
    Wants=network-online.target
    Requires=etcd.service

    [Service]
    Type=simple
    User=postgres
    Group=postgres
    ExecStart=/usr/local/bin/patroni /etc/patroni/patroni.yml
    Restart=always
    RestartSec=5
    TimeoutSec=30
    LimitNOFILE=102400

    [Install]
    WantedBy=multi-user.target
    EOF

  #Create the pgbackrest config directory.
  - mkdir -p /etc/pgbackrest

  #Create the pgbackrest config file.
  - |
    cat <<EOF > /etc/pgbackrest/pgbackrest.conf
    [global]
    repo1-type=s3
    repo1-path=/pg_backrest
    repo1-s3-bucket=postgres-backups-ranul
    repo1-s3-endpoint=sgp1.digitaloceanspaces.com
    repo1-s3-key=DO801H4ZCL8EPGT34JZU
    repo1-s3-key-secret=vWql32IwMNEu5C/ugTJUVfXgOUiZVC+ipxWX2Zd/ANE
    repo1-s3-region=sgp1
    repo1-s3-verify-tls=y
    repo1-retention-full=2
    repo1-retention-diff=7
    repo1-retention-archive-type=full
    repo1-retention-archive=2
    compress-type=lz4
    start-fast=y
    process-max=4
    log-level-console=info

    [${cluster_name}]
    pg1-path=/var/lib/postgresql/18/main
    pg1-port=5432
    EOF

  #Install Postgres, freeze the package version and clean the data directory.
  - apt install -y postgresql-18 postgresql-client-18
  - apt-mark hold postgresql-18 postgresql-client-18
  - apt-mark showhold
  - systemctl stop postgresql
  - rm -rf /var/lib/postgresql/18/main/*

  #Install Patroni 4.1.0 specifically with etcd support.
  - pip3 install "patroni[etcd]==4.1.0"
  - pip3 freeze | grep patroni   #Verify the version

  #Install pgBackRest, freeze the package version and disable the backup server.
  - apt install -y pgbackrest=2.58.0-1.pgdg22.04+1
  - apt-mark hold pgbackrest
  - chown -R postgres:postgres /tmp/pgbackrest
  - chown -R postgres:postgres /var/lib/pgbackrest
  - systemctl disable --now pgbackrest

  #Install etcd and freeze the package version.
  - apt install -y -o Dpkg::Options::="--force-confold" etcd=3.3.25+dfsg-7ubuntu0.22.04.2
  - apt-mark hold etcd
  - systemctl enable etcd && sudo systemctl restart etcd && sudo systemctl status etcd

#Reboot the server to apply all changes.
power_state:
  mode: reboot
  message: "Rebooting after installing dependencies."
  timeout: 30

final_message: "Cloud-init script has completed successfully and the server rebooted to apply changes."

